# Item category. Any new .yml in this folder becomes a category automatically
# (open it with /shop <filename>, and add a button for it in dialogs.yml -> main.buttons).
# Price by rarity: COMMON < UNCOMMON < RARE < EPIC < LEGENDARY (colours set in config.yml)
title: "<green><bold>Blocks"
columns: 3
button-width: 150
search: true
search-all-blocks: true   # searching HERE finds any obtainable BLOCK (blocks only). Main-menu search finds all items. See config.yml -> searchable-items
aliases: [block]
items:
  stone:            { material: STONE,            price: 10,    rarity: COMMON }
